name: apiverve_passwordbreach
description: "Password Breach Checker tells you whether a password appears in the Pwned Passwords corpus of passwords exposed in data breaches. Send the password or its SHA-1 hash and get a breached flag. Paid plans add how many times it was seen and a risk level."
version: 1.2.5
homepage: https://apiverve.com/marketplace/passwordbreach?utm_source=dart&utm_medium=referral&utm_content=homepage
repository: https://github.com/apiverve/passwordbreach-api/tree/main/dart

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  http: ^1.1.0
  http_parser: ^4.0.0

dev_dependencies:
  lints: ^3.0.0
  test: ^1.24.0
