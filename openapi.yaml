openapi: 3.0.4
info:
  title: Password Breach Checker
  description: >-
    Password Breach Checker tells you whether a password appears in the Pwned
    Passwords corpus of passwords exposed in data breaches. Send the password or
    its SHA-1 hash and get a breached flag. Paid plans add how many times it was
    seen and a risk level.
  termsOfService: https://apiverve.com/terms/
  contact:
    name: APIVerve Support
    email: hello@apiverve.com
    url: https://apiverve.com/contact
  version: 1.0.0
externalDocs:
  description: Learn more about APIVerve
  url: https://docs.apiverve.com?utm_source=openapi
servers:
  - url: https://api.apiverve.com/
paths:
  /v1/passwordbreach:
    post:
      summary: Password Breach Checker
      description: >-
        Check whether a password or its SHA-1 hash appears in known data
        breaches
      operationId: passwordbreach
      parameters: []
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: status
                  error:
                    type: string
                    description: error
                  data:
                    type: object
                    description: data
              example:
                status: ok
                error: null
                data:
                  breached: true
                  breachCount: 2266543
                  riskLevel: critical
                  inputType: password
                  hashPrefix: CBFDA
        '401':
          description: Your request was not authorized, or your API Key was invalid
        '404':
          description: Requested resource was not found
        '500':
          description: A server error has occurred, try again later
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  type: string
                  description: >-
                    The password to check. Hashed on receipt and never stored.
                    Send this or hash
                hash:
                  type: string
                  description: >-
                    The 40-character hex SHA-1 of the password, instead of the
                    password itself
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: x-api-key
      in: header
security:
  - api_key: []
sampleRequest:
  password: password123
